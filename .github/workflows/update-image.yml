name: Update Docker CI image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  packages: write

concurrency:
  group: update-docker-ci-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lib-arch-env

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Dockerfile
        run: |
          cat > /tmp/Dockerfile <<EOF
          FROM archlinux:latest
          RUN pacman -Syu --needed --noconfirm \
              base-devel cmake ninja clang clazy pkgconf git \
              qt6-base qt6-declarative qt6-wayland ffmpeg wayland wayland-protocols && \
              pacman -Scc --noconfirm
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: /tmp/Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
