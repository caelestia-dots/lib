name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      pull-requests: read
    with:
      filter-group: build

  build-nix:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-
          # collect garbage until the Nix store size (in bytes) is at most this limit
          gc-max-store-size-linux: 1073741824
          purge: true
          purge-prefixes: nix-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build flake
        run: nix build

  build-cpp:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: build-arch-${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/lib-arch-env:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            c_compiler: gcc
            cpp_compiler: g++
          - name: clazy
            c_compiler: clang
            cpp_compiler: clazy

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_CXX_FLAGS=-Werror \
            -DBUILD_TESTING=OFF \
            -DVERSION=0.0.1 \
            -DGIT_REVISION='${{ github.sha }}'
          cmake --build build

  build-check:
    if: always()
    needs:
      - changes
      - build-nix
      - build-cpp
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify build results
        uses: $/.github/actions/verify-checks
        with:
          needs: ${{ toJSON(needs) }}
          checks: |
            {
              "build-nix": "build",
              "build-cpp": "build"
            }
